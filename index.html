<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="关系拼盘">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="关系拼盘：两个人对同一份清单各选一遍，对比共识与分歧。无需注册，答案在链接里。">
<title>关系拼盘 · 双人问卷交叉对比</title>
<style>:root {
  --ink: #1b1a18;
  --ink-2: #574f45;
  --muted: #8b857c;
  --muted-2: #a8a199;
  --paper: #f6f4f0;
  --line: #ece7df;
  --card: #ffffff;
  --green: #2f8f5b;
  --teal: #22806b;
  --amber: #d69a24;
  --blue: #4a7ec0;
  --purple: #7a5aa8;
  --red: #c0453f;
  --slate: #7c8894;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
    "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
}

.serif {
  font-family: "Songti SC", "SimSun", Georgia, serif;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 20px calc(28px + env(safe-area-inset-bottom));
}

/* ---------- 通用 ---------- */
.kicker {
  font-size: 11px;
  letter-spacing: 2px;
  color: #b0a99f;
  text-transform: uppercase;
}

.card {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 4px 14px rgba(27, 26, 24, 0.06);
}

.btn {
  display: block;
  width: 100%;
  height: 50px;
  line-height: 50px;
  text-align: center;
  border: 0;
  border-radius: 14px;
  background: var(--ink);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  padding: 0;
}

.btn:active {
  opacity: 0.75;
}

.btn.off {
  background: #dcd7ce;
  cursor: default;
}

.btn.ghost {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
}

.muted {
  color: var(--muted);
}

.tiny {
  font-size: 12px;
  color: var(--muted-2);
  line-height: 1.7;
}

/* ---------- 首页 ---------- */
.hero {
  padding: 42px 4px 26px;
}

.hero h1 {
  margin: 12px 0 0;
  font-size: 38px;
  line-height: 1.16;
  font-weight: 600;
  letter-spacing: 1px;
}

.hero p {
  margin: 14px 0 0;
  font-size: 14px;
  line-height: 1.7;
  color: #7d776e;
}

.start {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 20px;
  background: var(--ink);
  border: 0;
  border-radius: 16px;
  color: #fff;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}

.start-title {
  display: block;
  font-size: 17px;
  font-weight: 600;
}

.start-sub {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: #a8a29a;
}

.start-arrow {
  font-size: 20px;
}

.join-row {
  margin-top: 14px;
  display: flex;
  gap: 8px;
}

.join-row input {
  flex: 1;
  height: 46px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
}

.join-row button {
  width: 78px;
  height: 46px;
  border: 0;
  border-radius: 12px;
  background: #f4f0e9;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.howto {
  margin-top: 34px;
}

.howto-title {
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--muted-2);
  margin-bottom: 12px;
}

.howto-item {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 13px;
  line-height: 1.6;
  color: #6f6961;
}

.howto-item i {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 2px;
  border-radius: 50%;
  background: #eae5dd;
  color: #8b857c;
  font-size: 10px;
  font-style: normal;
  text-align: center;
  line-height: 18px;
}

.credit {
  margin-top: 38px;
  padding-top: 16px;
  border-top: 1px solid #ebe6de;
  font-size: 10px;
  line-height: 1.9;
  color: #b3aca2;
}

/* ---------- 选题 ---------- */
.page-head {
  padding: 28px 4px 16px;
}

.page-head h2 {
  margin: 0;
  font-size: 27px;
  font-weight: 600;
}

.page-head p {
  margin: 10px 0 0;
  font-size: 13px;
  line-height: 1.7;
  color: #7d776e;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px 10px;
  font-size: 12px;
  color: var(--muted);
}

.toolbar button {
  border: 0;
  background: #eae5dd;
  border-radius: 99px;
  padding: 6px 12px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}

.list {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(27, 26, 24, 0.06);
}

.row {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 13px 14px;
  border: 0;
  border-bottom: 1px solid #f3efea;
  background: #fff;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}

.row:last-child {
  border-bottom: 0;
}

.row.on {
  background: #fbfaf7;
}

.box {
  flex: none;
  width: 20px;
  height: 20px;
  border: 1px solid #ddd6cb;
  border-radius: 6px;
  position: relative;
}

.row.on .box {
  background: var(--ink);
  border-color: var(--ink);
}

.row.on .box::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 5px;
  width: 6px;
  height: 8px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(40deg);
}

.row-main {
  flex: 1;
  padding-left: 12px;
}

.row-title {
  display: block;
  font-size: 15px;
}

.row-sub {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  color: var(--muted-2);
}

.footer-fixed {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  background: rgba(246, 244, 240, 0.96);
  backdrop-filter: blur(6px);
  max-width: 480px;
  margin: 0 auto;
}

/* ---------- 答题 ---------- */
.answer-top {
  padding: 22px 4px 0;
}

.progress {
  height: 4px;
  background: #e7e2d9;
  border-radius: 99px;
  overflow: hidden;
}

.progress > div {
  height: 4px;
  background: var(--ink);
  border-radius: 99px;
  transition: width 0.2s;
}

.meta {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 11px;
  color: #9b948a;
}

.meta .who {
  padding: 2px 8px;
  border-radius: 99px;
  background: #eae5dd;
  color: #6f6961;
}

.saved {
  margin-top: 6px;
  height: 14px;
  text-align: right;
  font-size: 10px;
  color: #b3aca2;
}

.saved .on {
  color: var(--green);
}

.qcard {
  margin-top: 16px;
  padding: 22px 18px 18px;
}

.q-no {
  font-size: 11px;
  color: #b0a99f;
}

.q-text {
  margin-top: 10px;
  font-size: 23px;
  line-height: 1.5;
  font-weight: 600;
}

.q-hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted-2);
}

.opts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.opt {
  width: calc(50% - 4px);
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  text-align: left;
  font-family: inherit;
  cursor: pointer;
}

.opt .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: middle;
}

.opt .label {
  font-size: 15px;
  font-weight: 600;
}

.opt .sub {
  margin-top: 4px;
  padding-left: 13px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.opt.on {
  border-color: transparent;
}

.opt.on .label,
.opt.on .sub {
  color: inherit;
}

.nav {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.nav button {
  flex: 1;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 3px 10px rgba(27, 26, 24, 0.05);
  font-size: 13.5px;
  font-family: inherit;
  color: #6f6961;
  cursor: pointer;
}

.nav button.strong {
  background: var(--ink);
  color: #fff;
}

/* 档位底色 */
.t-green { background: #e7f4ec; color: #1f7a4d; }
.t-teal { background: #e2f0eb; color: #176a58; }
.t-amber { background: #fbf0d8; color: #96660f; }
.t-blue { background: #e8eff9; color: #33598f; }
.t-purple { background: #efeaf7; color: #5c4691; }
.t-red { background: #fbe8e5; color: #a83c32; }
.t-slate { background: #e9edf1; color: #55606b; }

.f-green { background: var(--green); }
.f-teal { background: var(--teal); }
.f-amber { background: var(--amber); }
.f-blue { background: var(--blue); }
.f-purple { background: var(--purple); }
.f-red { background: var(--red); }
.f-slate { background: var(--slate); }

/* ---------- 分享 ---------- */
.share-box {
  margin-top: 18px;
  padding: 18px;
}

.share-box h3 {
  margin: 0 0 8px;
  font-size: 15px;
}

.share-box code,
.share-box textarea,
.share-box input {
  display: block;
  width: 100%;
  min-height: 84px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fbfaf7;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  line-height: 1.5;
  color: #574f45;
  word-break: break-all;
  resize: vertical;
}

.share-box input {
  min-height: 0;
  height: 42px;
  padding: 0 12px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
}

.share-meta {
  margin-top: 8px;
  font-size: 11px;
  color: var(--muted-2);
}

/* ---------- 结果 ---------- */
.result-hero {
  padding: 34px 4px 12px;
}

.rate {
  margin-top: 8px;
  font-size: 66px;
  line-height: 1;
  font-weight: 600;
  letter-spacing: -1px;
}

.rate span {
  font-size: 24px;
  font-weight: 500;
  margin-left: 3px;
}

.hero-sub {
  margin-top: 8px;
  font-size: 12px;
  color: #948d84;
}

.headline {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 12px;
  border-radius: 99px;
  background: #eae5dd;
  font-size: 12.5px;
  color: var(--ink-2);
}

.dist {
  margin-top: 18px;
  padding: 14px;
}

.dist-bar {
  display: flex;
  height: 12px;
  border-radius: 99px;
  overflow: hidden;
  background: #f2efe9;
}

.dist-bar > div {
  height: 12px;
}

.dist-legend {
  display: flex;
  flex-wrap: wrap;
  margin-top: 10px;
}

.lg {
  display: flex;
  align-items: center;
  width: 50%;
  padding: 3px 0;
  font-size: 11.5px;
  color: #6f6961;
}

.lg i {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  margin-right: 5px;
  flex: none;
}

.lg b {
  margin-left: auto;
  padding-right: 6px;
  font-weight: 500;
  color: var(--ink);
}

.block {
  margin-top: 28px;
}

.block-title {
  font-size: 15px;
  font-weight: 600;
  padding: 0 4px;
}

.block-sub {
  margin-top: 4px;
  padding: 0 4px;
  font-size: 11px;
  color: var(--muted-2);
}

.mx {
  margin-top: 11px;
  padding: 10px;
}

.mx-head,
.mx-row {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
}

.mx-head > div,
.mx-row > div {
  flex: 1;
  text-align: center;
}

.mx-corner,
.mx-rowlabel {
  flex: 0 0 32px !important;
  font-size: 11px;
  color: var(--muted-2);
  line-height: 40px;
}

.mx-head > div {
  font-size: 11px;
  color: var(--muted-2);
  line-height: 18px;
}

.mx-cell {
  height: 40px;
  line-height: 40px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  background: #faf8f5;
}

.mx-cell.empty {
  background: #faf8f5;
}

.mx-legend {
  display: flex;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 0 4px;
}

.mx-legend > div {
  display: flex;
  align-items: center;
  width: 33.33%;
  padding: 3px 0;
  font-size: 10.5px;
  color: var(--muted);
}

.mx-legend i {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  margin-right: 4px;
}

.glist {
  margin-top: 11px;
  padding: 4px 14px;
}

.grow {
  padding: 11px 0;
  border-bottom: 1px solid #f3efea;
}

.grow:last-child {
  border-bottom: 0;
}

.grow-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
}

.grow-top b {
  font-weight: 500;
  color: var(--muted);
  font-size: 12.5px;
}

.gbar {
  margin-top: 7px;
  height: 5px;
  background: #f2efe9;
  border-radius: 99px;
  overflow: hidden;
}

.gbar > div {
  height: 5px;
  background: var(--green);
  border-radius: 99px;
}

.gmeta {
  margin-top: 5px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.chip {
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid #ebe6de;
  background: #fff;
  font-size: 11.5px;
  color: #6f6961;
  font-family: inherit;
  cursor: pointer;
}

.chip.on {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}

.chip em {
  margin-left: 4px;
  font-style: normal;
  opacity: 0.6;
}

.list-meta {
  margin: 8px 4px 0;
  font-size: 11px;
  color: var(--muted-2);
}

.sec-title {
  margin: 16px 4px 8px;
  font-size: 11px;
  color: var(--muted-2);
}

.item {
  padding: 12px;
  margin-bottom: 8px;
}

.item-text {
  font-size: 14px;
  line-height: 1.55;
}

.item-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 9px;
  gap: 8px;
}

.picks {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.pick {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10.5px;
}

.pick span {
  opacity: 0.62;
}

.pick b {
  font-weight: 600;
}

.cat {
  flex: none;
  padding: 3px 9px;
  border-radius: 99px;
  font-size: 10.5px;
}

.more {
  display: block;
  width: 100%;
  margin: 14px 0 4px;
  height: 44px;
  border: 1px dashed #ddd6cb;
  border-radius: 12px;
  background: #fff;
  font-size: 13px;
  font-family: inherit;
  color: var(--ink-2);
  cursor: pointer;
}

.more em {
  margin-left: 6px;
  font-style: normal;
  font-size: 11px;
  color: var(--muted-2);
}

.actions {
  margin-top: 28px;
}

.actions .again {
  display: block;
  width: 100%;
  margin-top: 10px;
  border: 0;
  background: none;
  font-size: 12.5px;
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
}

.empty {
  padding: 40px 0;
  text-align: center;
  font-size: 13px;
  color: var(--muted-2);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  transform: translateX(-50%);
  padding: 9px 16px;
  border-radius: 10px;
  background: rgba(27, 26, 24, 0.9);
  color: #fff;
  font-size: 12.5px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 9;
}

.toast.show {
  opacity: 1;
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

__def("packs", function (module, exports, require) {
/**
 * 题库访问层
 *
 * 数据本体在 utils/smorgasbord.js（由 data/smorgasbord-v6.json 生成），
 * 这里只做"分组 → 题目"的整理与自定义题解析，不写死任何题目文字。
 */

const data = require('./smorgasbord')

const CUSTOM_PACK_ID = 'custom'

/** 每个分组转成一个可作答的"题集"：分组内每一条 = 一道题 */
function toPack(group) {
  return {
    id: group.id,
    title: group.title,
    subtitle: group.items.length + ' 条',
    count: group.items.length,
    questions: group.items.slice()
  }
}

const PACKS = (data.groups || []).map(toPack)

function listPacks() {
  return PACKS.map(function (p) {
    return {
      id: p.id,
      title: p.title,
      subtitle: p.subtitle,
      count: p.count
    }
  })
}

function getPack(packId) {
  return (
    PACKS.filter(function (p) {
      return p.id === packId
    })[0] || null
  )
}

/** 全部题目拍平（跨分组总览用） */
function flatten() {
  const out = []
  PACKS.forEach(function (p) {
    p.questions.forEach(function (q, i) {
      out.push({
        packId: p.id,
        packTitle: p.title,
        index: i,
        text: q
      })
    })
  })
  return out
}

function totalItems() {
  return PACKS.reduce(function (sum, p) {
    return sum + p.count
  }, 0)
}

/**
 * 按分组 id 展开成题集，顺序固定跟随题库原顺序（不随勾选顺序变化）
 * @param {string[]} groupIds
 */
function expandGroups(groupIds) {
  const wanted = groupIds || []
  return PACKS.filter(function (p) {
    return wanted.indexOf(p.id) >= 0
  }).map(function (p) {
    return { id: p.id, title: p.title, items: p.questions.slice() }
  })
}

/**
 * 展开成扁平题目列表，每道题带稳定 key（groupId#序号），用于答案对齐
 * @param {Array} groups [{id,title,items}]
 */
function buildQuestionList(groups) {
  const out = []
  ;(groups || []).forEach(function (g) {
    ;(g.items || []).forEach(function (text, i) {
      out.push({
        groupId: g.id,
        groupTitle: g.title,
        index: i,
        key: g.id + '#' + i,
        text: text
      })
    })
  })
  return out
}

/** 把多行文本切成自定义题：忽略空行、去掉序号前缀、限长 */
function parseCustomQuestions(text) {
  return String(text || '')
    .split(/\r?\n/)
    .map(function (line) {
      return line
        .replace(/^\s*(?:\d+[.、)]|[-*•])\s*/, '')
        .trim()
    })
    .filter(function (line) {
      return line.length > 0
    })
    .map(function (line) {
      return line.length > 60 ? line.slice(0, 60) + '…' : line
    })
    .slice(0, 40)
}

module.exports = {
  CUSTOM_PACK_ID: CUSTOM_PACK_ID,
  PACKS: PACKS,
  listPacks: listPacks,
  getPack: getPack,
  expandGroups: expandGroups,
  buildQuestionList: buildQuestionList,
  flatten: flatten,
  totalItems: totalItems,
  parseCustomQuestions: parseCustomQuestions
}

});

__def("options", function (module, exports, require) {
/**
 * 作答档位（默认档，来源：原图「建议标记方式」）
 *
 * 这 6 档不是一条等差数列，每档带一个语义轴（axis）：
 *   in    = 接纳
 *   maybe = 中立 / 看情况
 *   later = 认可但延后
 *   talk  = 有前提，需要谈
 *   out   = 拒绝（硬性界限）
 * 对比判定只依赖 axis，不依赖选项序号 —— 这样单题换一套选项也能算。
 */

const DEFAULT_OPTIONS = [
  {
    value: 0,
    key: 'yes',
    label: '同意',
    sub: '可以，没问题',
    short: '同',
    axis: 'in',
    tone: 'green'
  },
  {
    value: 1,
    key: 'need',
    label: '必要',
    sub: '对我很重要',
    short: '必',
    axis: 'in',
    tone: 'teal'
  },
  {
    value: 2,
    key: 'maybe',
    label: '也许',
    sub: '不确定',
    short: '许',
    axis: 'maybe',
    tone: 'amber'
  },
  {
    value: 3,
    key: 'future',
    label: '未来可能',
    sub: '现在不行，以后可以',
    short: '未',
    axis: 'later',
    tone: 'blue'
  },
  {
    value: 4,
    key: 'discuss',
    label: '需要讨论',
    sub: '有条件，得谈',
    short: '谈',
    axis: 'talk',
    tone: 'purple'
  },
  {
    value: 5,
    key: 'hard-no',
    label: '绝对不行',
    sub: '硬性界限',
    short: '否',
    axis: 'out',
    tone: 'red'
  }
]

/** 未作答的标记值 */
const UNANSWERED = -1

/** 取某道题适用的选项集（题目自带 options 时优先，实现"不固定档位"） */
function forQuestion(question) {
  if (question && question.options && question.options.length) return question.options
  return DEFAULT_OPTIONS
}

function find(optionSet, value) {
  const list = optionSet || DEFAULT_OPTIONS
  for (let i = 0; i < list.length; i += 1) {
    if (list[i].value === value) return list[i]
  }
  return null
}

function axisOf(optionSet, value) {
  const opt = find(optionSet, value)
  return opt ? opt.axis : null
}

function labelOf(optionSet, value) {
  const opt = find(optionSet, value)
  return opt ? opt.label : '未答'
}

function toneOf(optionSet, value) {
  const opt = find(optionSet, value)
  return opt ? opt.tone : 'mute'
}

function isAnswer(value) {
  return typeof value === 'number' && value >= 0
}

module.exports = {
  DEFAULT_OPTIONS: DEFAULT_OPTIONS,
  UNANSWERED: UNANSWERED,
  forQuestion: forQuestion,
  find: find,
  axisOf: axisOf,
  labelOf: labelOf,
  toneOf: toneOf,
  isAnswer: isAnswer
}

});

__def("stats", function (module, exports, require) {
/**
 * 交叉对比统计（纯函数，无小程序 API，可被 Node 直接测试）
 *
 * 输入：题目列表 + 两方的答案表（key -> 档位值）
 * 输出：5 类结论、6x6 交叉矩阵、分组维度得分、逐题对照
 */

const options = require('./options')

const CATEGORIES = {
  agree_yes: { key: 'agree_yes', label: '一致接纳', tone: 'green', note: '两个人都可以' },
  agree_no: { key: 'agree_no', label: '一致拒绝', tone: 'slate', note: '两个人都不要' },
  timing: { key: 'timing', label: '步调不同', tone: 'blue', note: '一个现在行，一个想以后' },
  discuss: { key: 'discuss', label: '需要谈', tone: 'amber', note: '有「也许」或「需要讨论」' },
  conflict: { key: 'conflict', label: '硬性冲突', tone: 'red', note: '一个接纳，一个划了硬界限' },
  unanswered: { key: 'unanswered', label: '未答', tone: 'mute', note: '还没答' }
}

const CATEGORY_ORDER = ['agree_yes', 'agree_no', 'timing', 'discuss', 'conflict']

/**
 * 判定一条题目上两人的关系
 * @param {object} question 题目（用于取选项集）
 * @param {number} a A 的档位
 * @param {number} b B 的档位
 */
function classify(question, a, b) {
  if (!options.isAnswer(a) || !options.isAnswer(b)) return 'unanswered'
  const set = options.forQuestion(question)
  const ax = options.axisOf(set, a)
  const bx = options.axisOf(set, b)
  if (!ax || !bx) return 'unanswered'

  if (ax === 'in' && bx === 'in') return 'agree_yes'
  if (ax === 'out' && bx === 'out') return 'agree_no'
  if ((ax === 'in' && bx === 'out') || (ax === 'out' && bx === 'in')) return 'conflict'

  const hard = function (x) {
    return x === 'in' || x === 'out'
  }
  // 一方现在就要/现在就不，另一方说"以后可以" → 步调不同
  if ((ax === 'later' && hard(bx)) || (bx === 'later' && hard(ax))) return 'timing'

  return 'discuss'
}

function emptyCounts() {
  return { agree_yes: 0, agree_no: 0, timing: 0, discuss: 0, conflict: 0, unanswered: 0 }
}

/**
 * @param {Array} questions [{groupId, groupTitle, key, text}]
 * @param {object} answersA { key: value }
 * @param {object} answersB { key: value }
 */
function summarize(questions, answersA, answersB) {
  const list = questions || []
  const A = answersA || {}
  const B = answersB || {}
  const counts = emptyCounts()
  const matrix = []
  for (let i = 0; i < 6; i += 1) matrix.push([0, 0, 0, 0, 0, 0])

  const groupMap = {}

  list.forEach(function (q) {
    const a = A[q.key]
    const b = B[q.key]
    const cat = classify(q, a, b)
    counts[cat] += 1

    if (options.isAnswer(a) && options.isAnswer(b) && matrix[a] && matrix[a][b] !== undefined) {
      matrix[a][b] += 1
    }

    if (q.groupTitle) {
      if (!groupMap[q.groupTitle]) {
        groupMap[q.groupTitle] = { title: q.groupTitle, total: 0, answered: 0, counts: emptyCounts() }
      }
      const g = groupMap[q.groupTitle]
      g.total += 1
      g.counts[cat] += 1
      if (cat !== 'unanswered') g.answered += 1
    }
  })

  const total = list.length
  const answered = total - counts.unanswered
  const agree = counts.agree_yes + counts.agree_no
  const rate = answered > 0 ? Math.round((agree / answered) * 100) : 0

  const segments = CATEGORY_ORDER.map(function (key) {
    return {
      key: key,
      label: CATEGORIES[key].label,
      tone: CATEGORIES[key].tone,
      count: counts[key],
      pct: answered > 0 ? (counts[key] / answered) * 100 : 0
    }
  })

  const groups = Object.keys(groupMap)
    .map(function (k) {
      const g = groupMap[k]
      const ga = g.answered
      const ok = g.counts.agree_yes + g.counts.agree_no
      return {
        title: g.title,
        total: g.total,
        answered: ga,
        rate: ga > 0 ? Math.round((ok / ga) * 100) : 0,
        conflict: g.counts.conflict,
        discuss: g.counts.discuss,
        timing: g.counts.timing
      }
    })
    .sort(function (x, y) {
      return x.rate - y.rate
    })

  return {
    total: total,
    answered: answered,
    rate: rate,
    agree: agree,
    counts: counts,
    matrix: matrix,
    segments: segments,
    groups: groups,
    headline: headlineOf(answered, counts)
  }
}

function headlineOf(answered, counts) {
  if (answered === 0) return '还没有可比对的答案'
  if (counts.conflict === 0 && counts.discuss === 0 && counts.timing === 0) return '高度合拍'
  if (counts.conflict === 0 && counts.discuss <= 2) return '基本合拍，细节待谈'
  if (counts.conflict === 0) return '没有硬冲突，但要谈的地方不少'
  if (counts.conflict <= 2) return '大体一致，有几处硬碰硬'
  return '分歧不小，值得好好聊一次'
}

/** 6x6 矩阵的渲染数据（行 = A 的档位，列 = B 的档位） */
function matrixView(summary, optionSet) {
  const set = optionSet || options.DEFAULT_OPTIONS
  return set.map(function (rowOpt) {
    return {
      label: rowOpt.short,
      fullLabel: rowOpt.label,
      cells: set.map(function (colOpt) {
        const count = summary.matrix[rowOpt.value] ? summary.matrix[rowOpt.value][colOpt.value] : 0
        return {
          count: count,
          tone: CATEGORIES[classify(null, rowOpt.value, colOpt.value)].tone,
          empty: count === 0
        }
      })
    }
  })
}

/** 逐题对照 */
function rows(questions, answersA, answersB) {
  const A = answersA || {}
  const B = answersB || {}
  return (questions || []).map(function (q, i) {
    const a = A[q.key]
    const b = B[q.key]
    const cat = classify(q, a, b)
    const set = options.forQuestion(q)
    return {
      index: i,
      no: i + 1,
      key: q.key,
      text: q.text,
      groupTitle: q.groupTitle,
      aValue: a,
      bValue: b,
      aLabel: options.labelOf(set, a),
      bLabel: options.labelOf(set, b),
      aTone: options.toneOf(set, a),
      bTone: options.toneOf(set, b),
      category: cat,
      catLabel: CATEGORIES[cat].label,
      tone: CATEGORIES[cat].tone
    }
  })
}

module.exports = {
  CATEGORIES: CATEGORIES,
  CATEGORY_ORDER: CATEGORY_ORDER,
  classify: classify,
  summarize: summarize,
  matrixView: matrixView,
  rows: rows
}

});

__def("session", function (module, exports, require) {
/**
 * 会话推导（纯函数，无小程序 API）
 *
 * 房间本身只存原始状态，这里负责回答：
 *   - 这个人现在该答哪些题
 *   - 两人共同的题单是什么
 *   - 进度、是否都答完了
 *
 * 规则：发起人 A 先圈定分组范围，B 只能在 A 的范围内复选（可少选、不可加），
 * 所以"两人题目同一份"= A 范围 ∩ B 复选。
 */

const packs = require('./packs')

function scopeOf(room, who) {
  if (!room || !room.scope) return []
  const list = room.scope[who]
  return Array.isArray(list) ? list : []
}

/** 两人共同的题单分组（B 还没选时，暂时等于 A 的范围） */
function commonScope(room) {
  const a = scopeOf(room, 'A')
  if (!a.length) return []
  const b = room.scope && room.scope.B
  if (!Array.isArray(b)) return a
  return a.filter(function (id) {
    return b.indexOf(id) >= 0
  })
}

/**
 * 某人要作答的题
 * A：自己圈的全部；B：与 A 的交集
 */
function questionsFor(room, who) {
  const ids = who === 'B' ? commonScope(room) : scopeOf(room, 'A')
  return packs.buildQuestionList(packs.expandGroups(ids))
}

/** 两人共同题单（结果页用来对比） */
function commonQuestions(room) {
  return packs.buildQuestionList(packs.expandGroups(commonScope(room)))
}

function answersOf(room, who) {
  if (!room || !room.answers) return {}
  return room.answers[who] || {}
}

/** 某人已答数量 */
function answeredCount(room, who) {
  const answers = answersOf(room, who)
  return questionsFor(room, who).filter(function (q) {
    return typeof answers[q.key] === 'number' && answers[q.key] >= 0
  }).length
}

function progressOf(room, who) {
  const list = questionsFor(room, who)
  if (!list.length) return 0
  return Math.round((answeredCount(room, who) / list.length) * 100)
}

/** 某人是否已完成自己那份 */

const BITS_PER_ANSWER = 3
const UNANSWERED = 7
const MAX_GROUP = 28
const SEP = '~'

/* ------------------------------ 字节/字符串 ------------------------------ */

function toBytes(str) {

  for (let i = 0; i < bin.length; i += 1) out.push(bin.charCodeAt(i))

function BitWriter() {

  const base = isB ? state.scopeA : allIds
  const pre = isB ? state.scopeB.length ? state.scopeB : base : state.scopeA
  const picks = new Set(pre)

  const groups = packs.listPacks().filter(function (g) {
    return base.indexOf(g.id) >= 0
  })

  const rows = groups
    .map(function (g) {
      const on = picks.has(g.id)
      return (
        '<button class="row' + (on ? ' on' : '') + '" data-group="' + g.id + '">' +
        '<span class="box"></span>' +
        '<span class="row-main"><span class="row-title">' + esc(g.title) + '</span>' +
        '<span class="row-sub">' + g.count + ' 条</span></span></button>'
      )
    })
    .join('')

  app.innerHTML =
    '<div class="page-head">' +
    '<h2 class="serif">' + (isB ? '挑你想聊的' : '先圈定范围') + '</h2>' +
    '<p>' + (isB
      ? '对方圈了 ' + state.scopeA.length + ' 个分组。你在这范围内挑，可以少挑，不能多挑。'
      : '选中的分组会成为两人的共同题单，对方只能在你圈定的范围内再挑。') + '</p>' +
    '</div>' +
    '<div class="toolbar"><span id="count"></span><button data-action="all" id="allBtn"></button></div>' +
    '<div class="list" id="list">' + rows + '</div>' +
    '<div class="footer-fixed"><button class="btn" id="go" data-action="go"></button></div>'

  function refresh() {
    const n = groups.filter(function (g) {
      return picks.has(g.id)
    }).length
    const total = groups.reduce(function (sum, g) {
      return picks.has(g.id) ? sum + g.count : sum
    }, 0)
    document.getElementById('count').textContent = '已选 ' + n + ' 组 · ' + total + ' 条'
    document.getElementById('allBtn').textContent = n === groups.length ? '全不选' : '全选'
    const go = document.getElementById('go')
    go.textContent = total > 0 ? '开始作答 · ' + total + ' 条' : '先选至少一个分组'
    go.className = 'btn' + (total > 0 ? '' : ' off')
  }

  document.querySelectorAll('.row').forEach(function (el) {
    el.addEventListener('click', function () {
      const id = el.getAttribute('data-group')
      if (picks.has(id)) picks.delete(id)
      else picks.add(id)
      el.classList.toggle('on')
      refresh()
    })
  })

  bind('all', function () {
    const allOn = picks.size === groups.length
    groups.forEach(function (g) {
      if (allOn) picks.delete(g.id)
      else picks.add(g.id)
    })
    document.querySelectorAll('.row').forEach(function (el) {
      const id = el.getAttribute('data-group')
      el.classList.toggle('on', picks.has(id))
    })
    refresh()
  })

  bind('go', function () {
    if (!picks.size) return toast('至少选一个分组')
    const ids = groups
      .filter(function (g) {
        return picks.has(g.id)
      })
      .map(function (g) {
        return g.id
      })
    if (isB) {
      state.scopeB = ids
      state.idxB = 0
    } else {
      state.scopeA = ids
      state.answersA = {}
      state.idxA = 0
      state.subA = 0
    }
    save()
    location.hash = '#/answer'
  })

  refresh()
}

/* ---------------------------------- 答题 ---------------------------------- */

function viewAnswer() {
  const who = state.role
  const isB = who === 'B'
  if (isB && !state.scopeB.length) {
    location.hash = '#/pick'
    return
  }
  if (!isB && !state.scopeA.length) {
    location.hash = '#/pick'
    return
  }

  const list = session.questionsFor(room(), who)
  if (!list.length) {
    app.innerHTML = '<div class="empty">还没有题，先回去选分组</div>'
    return
  }

  const key = isB ? 'idxB' : 'idxA'
  let idx = Math.min(Math.max(state[key] || 0, 0), list.length - 1)
  const answers = isB ? state.answersB : state.answersA
  const q = list[idx]
  const answered = list.filter(function (x) {
    return typeof answers[x.key] === 'number'
  }).length
  const sameGroup = list.filter(function (x) {
    return x.groupId === q.groupId
  })
  const posInGroup = sameGroup.findIndex(function (x) {
    return x.key === q.key
  }) + 1

  const opts = options.DEFAULT_OPTIONS.map(function (o) {
    const on = answers[q.key] === o.value
    return (
      '<button class="opt' + (on ? ' on t-' + o.tone : '') + '" data-value="' + o.value + '">' +
      '<span class="dot f-' + o.tone + '"></span><span class="label">' + esc(o.label) + '</span>' +
      '<span class="sub">' + esc(o.sub) + '</span></button>'
    )
  }).join('')

  app.innerHTML =
    '<div class="answer-top">' +
    '<div class="progress"><div style="width:' + Math.round((answered / list.length) * 100) + '%"></div></div>' +
    '<div class="meta"><span class="who">' + (isB ? 'TA' : '你') + '</span>' +
    '<span>' + esc(q.groupTitle) + ' · ' + posInGroup + '/' + sameGroup.length + '</span>' +
    '<span>' + answered + '/' + list.length + '</span></div>' +
    '<div class="saved"><span class="on" id="saved"></span></div>' +
    '</div>' +
    '<div class="qcard card"><div class="q-no">第 ' + (idx + 1) + ' 条</div>' +
    '<div class="q-text serif">' + esc(q.text) + '</div>' +
    '<div class="q-hint">这一条，你的态度是</div></div>' +
    '<div class="opts">' + opts + '</div>' +
    '<div class="nav"><button data-action="prev">上一题</button>' +
    '<button data-action="skip">跳过</button>' +
    '<button data-action="finish" class="strong">交卷</button></div>'

  function pickValue(v) {
    answers[q.key] = v
    state[key] = idx
    save()
    const saved = document.getElementById('saved')
    if (saved) saved.textContent = '已保存'
    setTimeout(function () {
      if (idx < list.length - 1) {
        state[key] = idx + 1
        save()
        render()
      } else {
        toast('这是最后一题')
        render()
      }
    }, 130)
  }

  document.querySelectorAll('.opt').forEach(function (el) {
    el.addEventListener('click', function () {
      pickValue(Number(el.getAttribute('data-value')))
    })
  })

  bind('prev', function () {
    if (idx === 0) return toast('已经是第一题')
    state[key] = idx - 1
    save()
    render()
  })

  bind('skip', function () {
    if (idx >= list.length - 1) return toast('这是最后一题')
    state[key] = idx + 1
    save()
    render()
  })

  bind('finish', function () {
    const left = list.length - answered
    if (left > 0 && !confirm('还有 ' + left + ' 条没答。没答的不会计入对比。现在交卷吗？')) return
    if (isB) {
      state.subB = Date.now()
      save()
      location.hash = '#/result'
    } else {
      state.subA = Date.now()
      save()
      location.hash = '#/share'
    }
  })
}

/* -------------------------------- 分享/回传 -------------------------------- */

function sharePayload(mode) {
  return codec.encode(
    {
      scopeA: state.scopeA,
      scopeB: mode === 'both' ? state.scopeB : [],
      answersA: state.answersA,
      answersB: mode === 'both' ? state.answersB : {},
      names: { A: state.names.A, B: mode === 'both' ? state.names.B : '' }
    },
    schema
  )
}

function viewShare() {
  const mode = /m=both/.test(location.hash) ? 'both' : 'a'

  // 邀请码（mode 'a'）只属于发起人；第二人没有可发的邀请
  if (mode === 'a' && state.role === 'B') {
    location.hash = state.subB ? '#/result' : '#/answer'
    return
  }

  let link = makeLink(sharePayload(mode))
  const isFile = !link

  const title = mode === 'both' ? '把结果发回给对方' : '把这条发给对方'
  const sub =
    mode === 'both'
      ? '对方打开这条就能看到你们俩的对比结果，和你现在看到的一样。'
      : '对方打开后，会在你选的分组范围内再挑一遍，然后各自作答。'

  const nameField =
    mode === 'a'
      ? '<div class="share-box card"><h3>你的称呼（可选）</h3>' +
        '<input id="nameA" maxlength="12" placeholder="让对方知道是谁发的" value="' +
        esc(state.names.A || '') + '" />' +
        '<div class="share-meta">填了之后，对方第一眼看到「' +
        (state.names.A ? esc(state.names.A) : '你') + '想和你聊聊这些」</div></div>'
      : ''

  app.innerHTML =
    '<div class="page-head"><h2 class="serif">' + title + '</h2><p>' + sub + '</p></div>' +
    nameField +
    (link
      ? '<div class="share-box card"><h3>链接</h3><textarea readonly rows="2" id="linkBox">' + esc(link) + '</textarea>' +
        '<div class="share-meta"><span id="linkLen">' + link.length + '</span> 字符 · 很短，直接发微信就行</div>' +
        '<div style="margin-top:10px"><button class="btn" data-action="copyLink">复制链接</button></div></div>'
      : '<div class="share-box card"><h3>当前是本地文件打开</h3>' +
        '<div class="tiny">这个页面是用 file:// 打开的，没法直接生成可点开的链接。' +
        '你可以把下面的「邀请码」发过去，让对方粘进首页输入框；' +
        '或者把整个 HTML 放到任意静态托管（GitHub Pages、Vercel、自己的服务器）后再分享链接。</div></div>') +
    '<div class="share-box card"><h3>邀请码（纯文本，一定能用）</h3>' +
    '<textarea readonly rows="2" id="codeBox">' + esc(sharePayload(mode)) + '</textarea>' +
    '<div class="share-meta"><span id="codeLen">' + sharePayload(mode).length + '</span> 字符 · 对方粘贴到首页输入框即可</div>' +
    '<div style="margin-top:10px"><button class="btn ghost" data-action="copyCode">复制邀请码</button></div></div>' +
    (mode === 'both'
      ? '<div style="margin-top:14px"><button class="btn ghost" data-action="toResult">回到结果页</button></div>'
      : '<div style="margin-top:14px;display:flex;gap:8px">' +
        '<button class="btn ghost" data-action="editMine" style="flex:1">回去改答案</button>' +
        '<button class="btn ghost" data-action="toResult" style="flex:1">先看看我自己的答案</button></div>')

  const nameInput = document.getElementById('nameA')
  if (nameInput) {
    nameInput.addEventListener('input', function () {
      state.names.A = nameInput.value.slice(0, 12)
      save()
      const next = sharePayload('a')
      const lb = document.getElementById('linkBox')
      const cb = document.getElementById('codeBox')
      if (lb) {
        lb.value = makeLink(next)
        document.getElementById('linkLen').textContent = lb.value.length
      }
      if (cb) {
        cb.value = next
        document.getElementById('codeLen').textContent = next.length
      }
    })
  }

  bind('copyLink', function () {
    const el = document.getElementById('linkBox')
    if (el) copyText(el.value)
  })
  bind('copyCode', function () {
    const el = document.getElementById('codeBox')
    if (el) copyText(el.value)
  })
  bind('editMine', function () {
    goEdit()
  })
  bind('toResult', function () {
    location.hash = mode === 'both' ? '#/result' : '#/'
  })
  if (isFile) toast('本地打开：请用邀请码分享')
}

/* ---------------------------------- 结果 ---------------------------------- */

function viewResult() {
  const qs = session.commonQuestions(room())
  if (!qs.length) {
    app.innerHTML =
      '<div class="page-head"><h2 class="serif">还没有结果</h2>' +
      '<p>两个人的分组还没有交集，或者对方还没开始。</p></div>' +
      '<button class="btn" data-action="back">回到首页</button>'
    bind('back', function () {
      location.hash = '#/'
    })
    return
  }

  const summary = stats.summarize(qs, state.answersA, state.answersB)
  const isB = state.role === 'B'
  const labelA = esc(state.names.A || (isB ? '对方' : '你'))
  const labelB = esc(state.names.B || (isB ? '你' : '对方'))

  const segs = summary.segments
    .filter(function (s) {
      return s.count > 0
    })
    .map(function (s) {
      return '<div class="f-' + s.tone + '" style="width:' + s.pct.toFixed(2) + '%"></div>'
    })
    .join('')

  const legend = summary.segments
    .map(function (s) {
      return (
        '<div class="lg"><i class="f-' + s.tone + '"></i>' + s.label +
        '<b>' + s.count + '</b></div>'
      )
    })
    .join('')

  const mv = stats.matrixView(summary)
  const head =
    '<div class="mx-head"><div class="mx-corner"></div>' +
    mv.map(function (r) {
      return '<div>' + r.label + '</div>'
    }).join('') +
    '</div>'
  const mxRows = mv
    .map(function (row) {
      return (
        '<div class="mx-row"><div class="mx-rowlabel">' + row.label + '</div>' +
        row.cells
          .map(function (c) {
            return '<div class="mx-cell' + (c.empty ? ' empty' : ' t-' + c.tone) + '">' +
              (c.empty ? '' : c.count) + '</div>'
          })
          .join('') +
        '</div>'
      )
    })
    .join('')

  const groups = summary.groups
    .slice(0, 4)
    .map(function (g) {
      return (
        '<div class="grow"><div class="grow-top"><span>' + esc(g.title) + '</span><b>' + g.rate + '%</b></div>' +
        '<div class="gbar"><div style="width:' + g.rate + '%"></div></div>' +
        '<div class="gmeta">' + g.answered + '/' + g.total + ' 条可比对' +
        (g.conflict > 0 ? ' · 冲突 ' + g.conflict : '') + '</div></div>'
      )
    })
    .join('')

  const chipDefs = [
    { key: 'all', label: '全部', count: null },
    { key: 'agree_yes', label: '一致接纳', count: summary.counts.agree_yes },
    { key: 'agree_no', label: '一致拒绝', count: summary.counts.agree_no },
    { key: 'conflict', label: '硬性冲突', count: summary.counts.conflict },
    { key: 'discuss', label: '需要谈', count: summary.counts.discuss },
    { key: 'timing', label: '步调不同', count: summary.counts.timing }
  ]
  const chips = chipDefs
    .map(function (c) {
      return (
        '<button class="chip' + (state.filter === c.key ? ' on' : '') + '" data-filter="' + c.key + '">' +
        c.label + (c.count === null ? '' : '<em>' + c.count + '</em>') + '</button>'
      )
    })
    .join('')

  const allRows = stats.rows(qs, state.answersA, state.answersB)
  const filtered =
    state.filter === 'all'
      ? allRows
      : allRows.filter(function (r) {
          return r.category === state.filter
        })
  const shown = filtered.slice(0, state.limit)

  let blocks = ''
  let lastTitle = null
  shown.forEach(function (r) {
    if (r.groupTitle !== lastTitle) {
      blocks += '<div class="sec-title">' + esc(r.groupTitle) + '</div>'
      lastTitle = r.groupTitle
    }
    blocks +=
      '<div class="item card"><div class="item-text">' + esc(r.text) + '</div>' +
      '<div class="item-bottom"><div class="picks">' +
      '<span class="pick t-' + r.aTone + '"><span>' + labelA + '</span><b>' + esc(r.aLabel) + '</b></span>' +
      '<span class="pick t-' + r.bTone + '"><span>' + labelB + '</span><b>' + esc(r.bLabel) + '</b></span>' +
      '</div><span class="cat t-' + r.tone + '">' + r.catLabel + '</span></div></div>'
  })

  const more =
    filtered.length > shown.length
      ? '<button class="more" data-action="more">显示更多<em>还有 ' + (filtered.length - shown.length) + ' 条</em></button>'
      : ''

  const shareBack = isB
    ? '<div class="share-box card" style="margin-top:20px">' +
      '<h3>把结果发给 ' + esc(state.names.A || '对方') + '</h3>' +
      '<input id="nameB" maxlength="12" placeholder="你的称呼（可选）" value="' + esc(state.names.B || '') + '" />' +
      '<div class="tiny" style="margin-top:8px">TA 现在只看得到自己的答案，需要这条链接才能看到对比。</div>' +
      '<div style="margin-top:10px"><button class="btn" data-action="copyBack">复制回传链接</button></div>' +
      '<div style="margin-top:8px;text-align:center"><button class="chip" data-action="toBackLink">查看完整链接</button></div>' +
      '<div style="margin-top:8px;text-align:center"><button class="chip" data-action="editMine">答案填错了，回去改</button></div>' +
      '</div>'
    : ''

  app.innerHTML =
    '<div class="result-hero"><div class="kicker">AGREEMENT</div>' +
    '<div class="rate serif">' + summary.rate + '<span>%</span></div>' +
    '<div class="hero-sub">' + summary.answered + ' 条可比对 · 共 ' + summary.total + ' 条</div>' +
    '<div class="headline">' + esc(summary.headline) + '</div></div>' +

    '<div class="dist card"><div class="dist-bar">' + segs + '</div>' +
    '<div class="dist-legend">' + legend + '</div></div>' +

    '<div class="block"><div class="block-title">交叉矩阵</div>' +
    '<div class="block-sub">行 = ' + labelA + '的答案，列 = ' + labelB + '的答案，数字是条目数</div>' +
    '<div class="mx card">' + head + mxRows + '</div>' +
    '<div class="mx-legend">' +
    '<div><i class="f-green"></i>一致接纳</div><div><i class="f-slate"></i>一致拒绝</div>' +
    '<div><i class="f-blue"></i>步调不同</div><div><i class="f-amber"></i>需要谈</div>' +
    '<div><i class="f-red"></i>硬性冲突</div></div></div>' +

    (groups
      ? '<div class="block"><div class="block-title">分歧最大的分组</div>' +
        '<div class="block-sub">按一致率从低到高</div><div class="glist card">' + groups + '</div></div>'
      : '') +

    '<div class="block"><div class="block-title">逐条对照</div>' +
    '<div class="chips">' + chips + '</div>' +
    '<div class="list-meta">共 ' + filtered.length + ' 条' +
    (filtered.length > shown.length ? '，当前显示 ' + shown.length + ' 条' : '') + '</div>' +
    blocks + more + '</div>' +

    shareBack +
    '<div class="actions"><button class="btn ghost" data-action="again">再来一份</button></div>'

  document.querySelectorAll('[data-filter]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.filter = el.getAttribute('data-filter')
      state.limit = PAGE
      save()
      render()
    })
  })

  bind('more', function () {
    state.limit += PAGE
    save()
    render()
  })
  bind('again', function () {
    if (confirm('清空这次的数据，重新开始？')) reset()
  })
  bind('copyBack', function () {
    const nm = document.getElementById('nameB')
    if (nm) {
      state.names.B = nm.value.slice(0, 12)
      save()
    }
    const p = sharePayload('both')
    copyText(makeLink(p) || p)
  })
  bind('toBackLink', function () {
    const nm = document.getElementById('nameB')
    if (nm) {
      state.names.B = nm.value.slice(0, 12)
      save()
    }
    location.hash = '#/share?m=both'
  })
  bind('editMine', function () {
    goEdit()
  })
}

/* --------------------------------- 路由 ---------------------------------- */

function enterPayload(payload) {
  const res = codec.decode(payload, schema)
  if (!res.ok) {
    toast('链接无效：' + (res.error || '无法解析'))
    return
  }
  const hasB =
    res.scopeB.length > 0 ||
    Object.keys(res.answersB).length > 0

  state.names = {
    A: (res.names && res.names.A) || '',
    B: (res.names && res.names.B) || ''
  }

  if (hasB) {
    state.scopeA = res.scopeA
    state.answersA = res.answersA
    state.scopeB = res.scopeB
    state.answersB = res.answersB
    state.role = 'A'
    state.subA = Date.now()
    state.subB = Date.now()
    state.filter = 'all'
    state.limit = PAGE
    save()
    location.hash = '#/result'
  } else if (res.scopeA.length) {
    state.scopeA = res.scopeA
    state.answersA = res.answersA
    state.scopeB = []
    state.answersB = {}
    state.subA = 1
    state.subB = 0
    state.role = 'B'
    state.idxB = 0
    save()
    location.hash = '#/welcome'
  } else {
    toast('这条链接里没有内容')
  }
}

function bind(action, fn) {
  document.querySelectorAll('[data-action="' + action + '"]').forEach(function (el) {
    el.addEventListener('click', fn)
  })
}

function render() {
  const hash = location.hash || '#/'
  if (hash.indexOf('#/join') === 0) {
    const m = /[?&]d=([^&\s#]+)/.exec(hash)
    if (m) {
      enterPayload(m[1])
      return
    }
    location.hash = '#/'
    return
  }
  if (hash.indexOf('#/welcome') === 0) return viewWelcome()
  if (hash.indexOf('#/pick') === 0) return viewPick()
  if (hash.indexOf('#/answer') === 0) return viewAnswer()
  if (hash.indexOf('#/share') === 0) return viewShare()
  if (hash.indexOf('#/result') === 0) return viewResult()
  return viewHome()
}

window.addEventListener('hashchange', render)
render()

})();
</script>
